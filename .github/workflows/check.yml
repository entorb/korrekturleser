name: Check Code

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1 # latest only

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Run prek pre-commit
        uses: j178/prek-action@v3.0.0

      - name: Prepare
        run: |
          uv sync --frozen --no-build
          pnpm install --frozen-lockfile
          cp .env.example .env
          sed -i 's/^LLM_PROVIDERS=.*/LLM_PROVIDERS=Mock/' .env

      - name: Run md lint
        run: pnpm exec markdownlint-cli2 "**/*.md"

      - name: Run CSpell
        run: pnpm exec cspell-cli --gitignore --unique .

      - name: Run py lint Ruff
        run: |
          uv run --frozen --no-build ruff format --check
          uv run --frozen --no-build ruff check --no-fix --output-format=github

      - name: Run py type check Pyright
        run: uv run --frozen --no-build pyright shared fastapi_app streamlit_app

      # - name: Setup Biome
      #   uses: biomejs/setup-biome@v2
      #   with:
      #     version: latest

      - name: Run js format Biome
        run: pnpm exec biome ci .

      - name: Run js lint ESLint
        run: pnpm exec eslint . --cache

      - name: Run py test Pytest
        run: |
          uv run --frozen --no-build pytest
        #     --cov \
        #     --cov-report=xml:coverage.xml \
        #     --quiet \
        #     --tb=short

      - name: Run js test Vitest
        run: pnpm exec vitest --watch=false

      - name: Run js type check
        run: pnpm exec vue-tsc --build

      - name: Run js dead code Knip
        run: pnpm knip

      - name: Run py dead code Vulture
        run: uv run --frozen --no-build vulture

      # for SonarQube coverage report
      # - uses: SonarSource/sonarqube-scan-action@v8
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run py audit
        run: uv audit --preview-features audit

      - name: Run js audit
        run: pnpm audit --prod
