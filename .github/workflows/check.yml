name: Check Code

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1 # latest only

      - name: Run prek pre-commit
        uses: j178/prek-action@v3.0.0

      - name: Run md lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'

      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@v8
        with:
          files: '**/*'
          incremental_files_only: false

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1 # latest only

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Prepare
        run: |
          uv sync --frozen --no-build
          cp .env.example .env
          sed -i 's/^LLM_PROVIDERS=.*/LLM_PROVIDERS=Mock/' .env

      - name: Run py lint Ruff
        run: |
          uv run --frozen --no-build ruff format --check
          uv run --frozen --no-build ruff check --no-fix --output-format=github

      - name: Run py type check Pyright
        run: uv run --frozen --no-build pyright shared fastapi_app streamlit_app

      - name: Run py test Pytest
        run: |
          uv run --frozen --no-build pytest

      # - name: Run py test Pytest
      #   run: |
      #     uv run --frozen --no-build pytest \
      #       --cov \
      #       --cov-report=xml:coverage.xml \
      #       --quiet \
      #       --tb=short
      #
      # - name: Upload py coverage
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage-python
      #     path: coverage.xml
      #     retention-days: 1

      - name: Run py dead code Vulture
        run: uv run --frozen --no-build vulture

      - name: Run py audit
        run: uv audit --preview-features audit

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1 # latest only

      - uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Prepare
        run: pnpm install --frozen-lockfile

      # - name: Setup Biome
      #   uses: biomejs/setup-biome@v2
      #   with:
      #     version: latest

      - name: Run js format Biome
        run: pnpm exec biome ci .

      - name: Run js lint ESLint
        run: pnpm exec eslint . --cache

      - name: Run js test Vitest
        run: pnpm exec vitest --watch=false

      # - name: Run js test Vitest
      #   run: pnpm exec vitest --watch=false --coverage
      #
      # - name: Upload js coverage
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage-js
      #     path: coverage/lcov.info
      #     retention-days: 1

      - name: Run js type check
        run: pnpm exec vue-tsc --build

      - name: Run js dead code Knip
        run: pnpm knip

      - name: Run js audit
        run: pnpm audit --prod

