sonar.organization=entorb
sonar.projectKey=entorb_korrekturleser
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.version=3.14
# check whole project, not only src/
# sonar.sources=fastapi_app,shared,streamlit_app,vue_app
sonar.sources=.
sonar.sourceEncoding=UTF-8
# exclusions
sonar.coverage.exclusions=\
  src/**/__init__.py,\
  scripts/**,\
  tests/**,\
  vue_app/**/__tests__/**
sonar.cpd.exclusions=\
  tests/**,\
  vue_app/**/__tests__/**
# files created by pytest shall not be scanned
# auto-generated by @hey-api/openapi-ts, do not scan
# check.yml: skip Sonar findings (S6505) on the GitHub Actions workflow
sonar.exclusions=\
  .coverage,\
  .ruff_cache/**,\
  .venv/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/*.sql,\
  **/*.sqlite,\
  coverage/**,\
  db.sqlite,\
  htmlcov/**,\
  node_modules/**,\
  public/**,\
  tests/**,\
  vue_app/**/__tests__/**,\
  vue_app/src/api/**
