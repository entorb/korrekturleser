[project]
name = "korrekturleser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "azure-identity~=1.26.0",
    "bcrypt~=5.0.0",
    "dotenv~=0.9.9",
    "fastapi~=0.143.0",
    "google-genai~=2.30.1",
    "mistralai~=3.2.0",
    "mysql-connector-python==26.7.0",
    "openai~=3.29.0",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pydantic~=2.14.1",
    "pyjwt~=2.15.0",
    "sentry-sdk>=2.72.0",
    "slowapi~=0.1.10",
    "st-copy~=2.0.0",
    "streamlit~=1.65.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "ollama>=0.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
    "vulture>=2.16",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["shared", "streamlit_app", "fastapi_app"]
testpaths = ["tests"]

[tool.coverage.run]
# source="." => single source root so coverage.xml paths are unique for SonarQube
source = ["."]
omit = [".venv/*", "node_modules/*", "tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.uv]
required-version = "~=0.13.4"
exclude-newer = "7 days"
# TODO: remove after 2026-10-26
exclude-newer-package = { certifi = false }

# pyarrow cannot be updated beyond 20.0.0 (pinned by pandas==2.2.3 compatibility)
[tool.uv.audit]
# pillow fix 13.0.0 blocked: streamlit 1.66 requires pillow<13; app does not decode images
# TODO: remove when streamlit allows pillow>=13
# cspell:disable
ignore = [
  "GHSA-65qm-jvmh-6pqg",
  "GHSA-vx6w-vv9f-6gvg",
  "GHSA-58r4-6rv3-gfh8",
  "GHSA-q45j-58j2-45rg",
  "GHSA-462x-pgg6-55fp",
  "GHSA-8g5g-8vmr-9782",
  "GHSA-c6hw-5grf-ff96",
  "GHSA-p4wg-p73j-c528",
  "GHSA-pchr-8j38-3x4p",
]
# cspell:enable

[tool.pyright]
include = ["fastapi_app", "shared", "streamlit_app"]

[tool.vulture]
ignore_decorators = ["@app.get", "@router.get", "@router.post"]
paths = ["fastapi_app", "shared", "streamlit_app"]
exclude = ["fastapi_app/gunicorn_conf.py", "fastapi_app/schemas.py"]
ignore_names = ["CSS_HEADER", "LOGGER", "MOCK_USERS", "TextMode", "visible"]
