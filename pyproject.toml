[project]
name = "korrekturleser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "azure-identity>=1.26.0",
    "bcrypt>=5.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
    "gunicorn>=26.2.0",
    "mistralai>=3.2.0",
    "openai>=3.33.0",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "sentry-sdk>=2.72.0",
    "slowapi>=0.1.10",
    "st-copy>=2.0.0",
    "streamlit>=1.66.1",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ollama>=0.6.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
pythonpath = ["shared", "streamlit_app", "fastapi_app"]
testpaths = ["tests"]

[tool.coverage.run]
# source="." => single source root so coverage.xml paths are unique for SonarQube
source = ["."]
omit = [".venv/*", "node_modules/*", "tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.uv]
required-version = "~=0.13.6"
exclude-newer = "7 days"

# TODO: remove after 2026-10-26
# TODO: remove streamlit after 2026-10-28
# TODO: remove pyasn1 after 2026-11-07 (GHSA fix in 0.6.5)
exclude-newer-package = { certifi = false, streamlit = false, pyasn1 = false }

[tool.pyright]
include = ["fastapi_app", "shared", "streamlit_app"]

[tool.vulture]
ignore_decorators = ["@app.get", "@router.get", "@router.post"]
paths = ["fastapi_app", "shared", "streamlit_app"]
exclude = ["fastapi_app/gunicorn_conf.py", "fastapi_app/schemas.py"]
ignore_names = ["CSS_HEADER", "LOGGER", "MOCK_USERS", "TextMode", "visible"]
