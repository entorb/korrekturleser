[project]
name = "korrekturleser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.3",
    "bcrypt>=5.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "mistralai>=2.9.3",
    "mysql-connector-python==9.4.0",
    "openai>=3.1.0",
    "pandas==2.2.3",
    "pyarrow==20.0.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "slowapi>=0.1.10",
    "st-copy>=2.0.0",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "ollama>=0.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "tomli-w>=1.2.0",
    "uvicorn>=0.52.3",
    "vulture>=2.16",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["shared", "streamlit_app", "fastapi_app"]
testpaths = ["tests"]

[tool.coverage.run]
# source="." => single source root so coverage.xml paths are unique for SonarQube
source = ["."]
omit = [".venv/*", "node_modules/*", "tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]

[tool.uv]
# pyarrow cannot be updated beyond 20.0.0 (pinned by pandas==2.2.3 compatibility)

[tool.uv.audit]
ignore = ["GHSA-rgxp-2hwp-jwgg"]

[tool.vulture]
ignore_decorators = ["@app.get", "@router.get", "@router.post"]
paths = ["fastapi_app", "shared", "streamlit_app"]
exclude = ["fastapi_app/gunicorn_conf.py", "fastapi_app/schemas.py"]
ignore_names = ["CSS_HEADER", "LOGGER", "MOCK_USERS", "TextMode", "visible"]
