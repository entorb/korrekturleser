---
minimumReleaseAge: 10080 # 7 days (in minutes)
minimumReleaseAgeExclude:
  - js-yaml@4.3.0 || 4.3.1
  - serialize-javascript@7.1.3
  - fast-uri@3.1.9
  - follow-redirects@1.16.2

allowBuilds:
  "@parcel/watcher": true
  core-js: true
  esbuild: true

overrides:
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  glob@^11.1.0: "^13.0.6"

auditConfig:
  ignoreGhsas:
    # TODO: remove after 7.11.26
    - GHSA-gcqx-w48m-w2h4 # deepmerge, no patch, build-time only via vite-plugin-pwa
    # TODO: remove after 7.11.26
    - GHSA-3g3m-2fjr-6pw4 # glob, patch deps too fresh for cooldown, build-time only via vite-plugin-pwa
    # TODO: remove after 7.11.26
    - GHSA-g3hv-75wg-m249 # minimatch, patch deps too fresh for cooldown
